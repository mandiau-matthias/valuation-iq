<figure class="sl-chart" aria-label="{{ copy.historical }}">
<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title-{{ loop.index }} chart-desc-{{ loop.index }}">
 <title id="chart-title-{{ loop.index }}">{{ copy.historical }} — {{ c.name }}</title>
 <desc id="chart-desc-{{ loop.index }}">{{ copy[chart.basis] }}. {{ chart.currency }}. {% for p in chart.points %}{{ p.point.periodEnd }}: {{ number(p.point.low) }} – {{ number(p.point.high) }}. {% endfor %}</desc>
 {% for tick in chart.ticks %}<line x1="82" x2="600" y1="{{ tick.y }}" y2="{{ tick.y }}" stroke="#e3e7e5" stroke-width="1"/><text x="70" y="{{ tick.y+4 }}" text-anchor="end" fill="#596268" font-family="JetBrains Mono" font-size="10">{{ number(tick.value) }}</text>{% endfor %}
 {% for band in chart.bands %}<polygon points="{{ band }}" fill="#2ba899" fill-opacity="0.16"/>{% endfor %}
 {% for p in chart.points %}<line x1="{{ p.x }}" x2="{{ p.x }}" y1="{{ p.highY }}" y2="{{ p.lowY }}" stroke="#21786d" stroke-width="2"/><line x1="{{ p.x-5 }}" x2="{{ p.x+5 }}" y1="{{ p.highY }}" y2="{{ p.highY }}" stroke="#21786d" stroke-width="2"/><line x1="{{ p.x-5 }}" x2="{{ p.x+5 }}" y1="{{ p.lowY }}" y2="{{ p.lowY }}" stroke="#21786d" stroke-width="2"/><text x="{{ p.x }}" y="194" text-anchor="middle" fill="#596268" font-family="JetBrains Mono" font-size="11">{{ p.point.periodEnd[:4] }}</text>{% endfor %}
</svg>
<figcaption>{{ copy[chart.basis] }} · {{ chart.currency }}.{% for p in chart.points %}<span class="sl-chart-record">{{ p.point.periodEnd }}: {{ number(p.point.low) }} – {{ number(p.point.high) }}. {{ p.point.method }}. {{ copy.calculated }} {{ p.point.computedAt }}.{% for source in source_references(p.point.sources) %}{{ cite(source) }}{% endfor %}</span>{% endfor %}</figcaption>
</figure>
