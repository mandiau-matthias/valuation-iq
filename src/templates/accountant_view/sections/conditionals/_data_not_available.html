{# Standard "Data not available" message #}
<div class="report-callout" style="background-color: #FFFFFF; border-left: 4pt solid var(--upswitch-navy); padding: 12pt; margin: 12pt 0;">
    <p style="font-family: 'Inter', sans-serif; margin: 0; color: var(--upswitch-navy);"><strong>{{ t.accountant_cond_data_not_available_title }}</strong></p>
    {% if message %}
    <p style="font-family: 'Inter', sans-serif; margin: 8pt 0 0 0; color: var(--text-body);">{{ message }}</p>
    {% else %}
    <p style="font-family: 'Inter', sans-serif; margin: 8pt 0 0 0; color: var(--text-body);">{{ t.accountant_cond_data_not_available_default }}</p>
    {% endif %}
</div>
